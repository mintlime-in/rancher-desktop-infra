tenant:
  name: minio
  image:
    repository: quay.io/minio/minio
    tag: RELEASE.2025-04-08T15-41-24Z
    pullPolicy: IfNotPresent
  configSecret:
    name: minio-env-configuration
    accessKey: admin
    secretKey: admin
  pools:
    - servers: 1
      name: pool-0
      volumesPerServer: 2
      size: 10Gi
ingress:
  api:
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    enabled: true
    ingressClassName: "nginx"
    host: s3.localhost
    path: /
    pathType: Prefix
  console:
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    enabled: true
    ingressClassName: "nginx"
    host: minio.localhost
    path: /
    pathType: Prefix