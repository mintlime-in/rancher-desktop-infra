---
apiVersion: stackgres.io/v1beta1
kind: SGObjectStorage
metadata:
  name: minio-srmvcas
  namespace: srmvcas
spec:
  type: s3Compatible
  s3Compatible:
    bucket: srmvcas-backups
    endpoint: https://minio.srmvcas.svc.cluster.local
    enablePathStyleAddressing: true
    awsCredentials:
      secretKeySelectors:
        accessKeyId:
          name: srmvcas-srmvcas-db-backup
          key: accessKey
        secretAccessKey:
          name: srmvcas-srmvcas-db-backup
          key: secretKey
